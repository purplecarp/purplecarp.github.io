    <main>
        <header class="lesson-heading">
            <h1>等速運動</h1>
            <p>調整初始位置與速度，觀察位置如何隨時間改變。</p>
        </header>
        <!-- Classroom builds accessible controls, canvas, readouts and the time slider here. -->
        <div id="lesson"></div>
        <noscript>請啟用 JavaScript 以操作模擬；下方仍可閱讀物理原理。</noscript>
        <details class="lesson-panel lesson-notes">
            <summary>詳細說明與物理原理</summary>
            <article>
                <h2>位置與速度</h2>
                <p class="formula">x(t) = x₀ + vt　　a = 0</p>
                <p>向右為正。正速度使位置增加，負速度使位置減少，速度為零時保持靜止。</p>
            </article>
            <article>
                <h2>模型與顯示</h2>
                <p>物體視為質點，不受外力。軌跡每 0.1 s 取樣，箭頭為速度示意；改變參數後視野會調整。</p>
                <p>播放與暫停保留狀態，重播回到起點並保留參數；恢復預設會同時還原參數與顯示選項。</p>
            </article>
        </details>
    </main>
</body>
